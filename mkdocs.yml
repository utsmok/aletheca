site_name: Aletheca Docs
site_url: https://utsmok.github.io/aletheca/
repo_url: https://github.com/utsmok/aletheca/
site_author: S. Mok

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Usage:
      - Works: usage/works.md
      - Authors: usage/authors.md
      - Sources: usage/sources.md
      - Institutions: usage/institutions.md
      - Topics: usage/topics.md
      - Keywords: usage/keywords.md
      - Publishers: usage/publishers.md
      - Funders: usage/funders.md
      - Awards: usage/awards.md
      - Locations: usage/locations.md
      - Links: usage/links.md
  - Errors, retries, and rate limits: errors.md
  - Upstream quirks: upstream-quirks.md
  - API reference: reference.md
  - Contributing: contributing.md
  - Changelog: changelog.md
watch:
  - src/aletheca
